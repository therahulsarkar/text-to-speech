<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TTS</title>
  <link rel="stylesheet" href="./texttospeech.css">
</head>
<body>

  <div class="voiceinator">

    <h1>Text to speech</h1>

    <select name="voice" id="voices">
      <option value="">Select A Voice</option>
    </select>

    <label for="rate">Rate:</label>
    <input name="rate" type="range" min="0" max="3" value="1" step="0.1">

    <label for="pitch">Pitch:</label>
    <input name="pitch" type="range" min="0" max="2" step="0.1">

    <textarea class="textarea" name="text" placeholder="Type here..."></textarea>
    <button id="stop">Stop!</button>
    <button id="speak">Speak</button>

  </div>

  <script>
    const msg = new SpeechSynthesisUtterance();
    let voices = [];

    function populateVoices() {
      voices = speechSynthesis.getVoices().filter(voice => voice.lang.includes('en'));
      const options = voices.map(voice => `<option value="${voice.name}">${voice.name} (${voice.lang})</option>`);
      voicesDropdown.innerHTML = options.join('');
    }

    function setVoice(event) {
      msg.voice = voices.find(voice => voice.name === event.target.value);
    }

    function updateOptions() {
      msg.rate = parseFloat(document.querySelector('[name="rate"]').value);
      msg.pitch = parseFloat(document.querySelector('[name="pitch"]').value);
      msg.text = document.querySelector('[name="text"]').value;
    }

    function toggle(startOver = true) {
      speechSynthesis.cancel();
      if (startOver) {
        speechSynthesis.speak(msg);
      }
    }

    speechSynthesis.addEventListener('voiceschanged', populateVoices);
    voicesDropdown.addEventListener('change', setVoice);
    options.forEach(option => option.addEventListener('change', updateOptions));
    speakButton.addEventListener('click', toggle);
    stopButton.addEventListener('click', () => toggle(false));
  </script>

</body>
</html>
